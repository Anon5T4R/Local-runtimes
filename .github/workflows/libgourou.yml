name: build-libgourou-windows

# Builda os utils do libgourou (v0.8.10) para Windows x64 via MSYS2/MinGW64 e
# publica o zip como artefato deste run.
#
# Por que aqui (repo do espelho): o Windows NAO tem binario oficial do libgourou
# (o upstream so publica Debian + AppImage Linux).
#
# O libgourou NAO compila no Windows out-of-the-box; este workflow aplica um
# PORTE minimo (2026-09-11):
#   * win_compat.h (forcado com -include nos Makefiles do libgourou e dos utils):
#     memmem, htons/htonl, mkdir(path,mode)->_mkdir, strptime minimo e shim de
#     termios.
#   * remove os #include que nao existem no MinGW (arpa/inet.h, termios.h).
#   * uPDFParser.cpp (build separado): memmem + casts (unsigned long)ptr.
# O device.cpp JA tem fallback de MAC estatico para plataformas nao-Linux.
#
# Depois do run: baixar o artefato, subir na release do espelho e anotar o
# sha256 no MANIFEST.json + nos scripts fetch-libgourou.* do LocalConverter.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: MSYS2 (MINGW64) + dependencias
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            perl
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-libzip
            mingw-w64-x86_64-pugixml
            mingw-w64-x86_64-zlib

      - name: Clone + patch + build (v0.8.10)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.8.10 https://forge.soutade.fr/soutade/libgourou.git
          cd libgourou

          # Pre-clona o uPDFParser (lib interno). Se lib/updfparser existir, o
          # top Makefile pula ./scripts/setup.sh (alvo `lib` ja satisfeito) — o
          # que nos deixa patchá-lo antes de compilar.
          mkdir -p lib
          git clone --depth 1 https://forge.soutade.fr/soutade/uPDFParser.git lib/updfparser

          echo "=== patch uPDFParser: memmem + casts ==="
          perl -0pi -e 's|#include <string\.h>|#include <string.h>\n#ifdef _WIN32\n#include <stdint.h>\nstatic void* memmem(const void* _h, size_t _hl, const void* _n, size_t _nl) {\n    if (_nl == 0) return (void*)_h;\n    const char* p = (const char*)_h; const char* e = p + _hl - _nl;\n    for (; p <= e; ++p) if (memcmp(p, _n, _nl) == 0) return (void*)p;\n    return 0;\n}\n#endif|' lib/updfparser/src/uPDFParser.cpp
          sed -i 's/(unsigned long)subs/(uintptr_t)subs/g; s/(unsigned long)buffer/(uintptr_t)buffer/g' lib/updfparser/src/uPDFParser.cpp

          echo "=== build uPDFParser ==="
          make -C lib/updfparser BUILD_STATIC=1 BUILD_SHARED=0

          echo "=== win_compat.h ==="
          cat > win_compat.h <<'EOF'
          #ifndef WIN_COMPAT_H
          #define WIN_COMPAT_H
          #ifdef _WIN32
          #include <string.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <stdint.h>
          #include <direct.h>
          #include <time.h>

          static inline void* memmem(const void* h, size_t hl, const void* n, size_t nl) {
              if (nl == 0) return (void*)h;
              const char* p = (const char*)h; const char* e = p + hl - nl;
              for (; p <= e; ++p) if (memcmp(p, n, nl) == 0) return (void*)p;
              return 0;
          }
          static inline uint16_t gourou_htons(uint16_t v) { return (uint16_t)((v << 8) | (v >> 8)); }

          /* POSIX mkdir(path, mode) -> _mkdir(path) no Windows */
          #define mkdir(p, m) _mkdir(p)

          /* strptime minimo: so o formato ISO dos metadados (sufixo %z/%Z ignorado) */
          static inline char* strptime(const char* s, const char* format, struct tm* tm) {
              (void)format;
              int Y = 0, Mo = 0, D = 0, H = 0, Mi = 0, S = 0;
              if (sscanf(s, "%d-%d-%dT%d:%d:%d", &Y, &Mo, &D, &H, &Mi, &S) < 3) return 0;
              tm->tm_year = Y - 1900; tm->tm_mon = Mo - 1; tm->tm_mday = D;
              tm->tm_hour = H; tm->tm_min = Mi; tm->tm_sec = S; tm->tm_isdst = -1;
              return (char*)s;
          }

          /* termios: so o getch() de senha usa; com -a nunca e chamado */
          struct termios { unsigned long c_lflag; };
          #define tcgetattr(fd, t) 0
          #define tcsetattr(fd, act, t) 0
          #define TCSANOW 0
          #define ICANON 2
          #define ECHO 8

          /* sys/utsname.h nao existe no MinGW */
          struct utsname { char sysname[65]; char nodename[65]; char release[65]; char version[65]; char machine[65]; };
          static inline int uname(struct utsname* u) {
              strcpy(u->sysname, "Windows"); strcpy(u->nodename, "localhost");
              strcpy(u->release, ""); strcpy(u->version, ""); strcpy(u->machine, "x86_64");
              return 0;
          }

          /* pwd.h nao existe no MinGW. O branch que usa getpwuid e morto no
             nosso fluxo (sempre ativamos com -r / serial aleatorio). */
          struct passwd { char* pw_name; char* pw_dir; char* pw_shell; int pw_uid; int pw_gid; };
          static inline unsigned int getuid(void) { return 0; }
          static inline struct passwd* getpwuid(unsigned int uid) {
              (void)uid;
              static struct passwd pw = { (char*)"user", (char*)".", (char*)"", 0, 0 };
              return &pw;
          }

          /* realpath (POSIX) -> _fullpath */
          static inline char* realpath(const char* path, char* resolved) {
              char* buf = resolved ? resolved : (char*)malloc(260);
              if (!buf) return 0;
              if (_fullpath(buf, path, 260) == 0) { if (!resolved) free(buf); return 0; }
              return buf;
          }
          #endif
          #endif
          EOF

          echo "=== remove includes inexistentes no MinGW ==="
          sed -i 's|#include <arpa/inet.h>|/* via win_compat.h */|' src/libgourou.cpp
          sed -i 's|#include <termios.h>|/* via win_compat.h */|' utils/adept_activate.cpp
          sed -i 's|#include <sys/utsname.h>|/* via win_compat.h */|' src/device.cpp
          sed -i 's|#include <pwd.h>|/* via win_compat.h */|' src/device.cpp
          sed -i 's|uid_t uid = getuid();|unsigned int uid = getuid();|' src/device.cpp
          sed -i 's|htons(length)|gourou_htons(length)|' src/libgourou.cpp

          echo "=== forca o -include nos Makefiles ==="
          sed -i 's|-I./lib/updfparser/include|-I./lib/updfparser/include -include $(CURDIR)/win_compat.h|' Makefile
          sed -i 's|^CXXFLAGS=-Wall -fPIC|CXXFLAGS=-Wall -fPIC -include $(ROOT)/win_compat.h|' utils/Makefile
          grep -n "win_compat" Makefile utils/Makefile

          echo "=== build libgourou + utils ==="
          make CROSS=x86_64-w64-mingw32- BUILD_UTILS=1 BUILD_STATIC=1 STATIC_UTILS=1 BUILD_SHARED=0
          ls -la utils

      - name: Reunir exes + DLLs
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p pkg
          cp libgourou/utils/*.exe pkg/
          for exe in pkg/*.exe; do
            ldd "$exe" | awk '/=>/ {print $3}' | grep -iE '/mingw64/bin/' | sort -u | while read -r dll; do
              cp -n "$dll" pkg/ || true
            done
          done
          echo "--- conteudo do pacote ---"
          ls -la pkg

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path pkg/* -DestinationPath libgourou_utils-0.8.10-windows-x64.zip -Force
          Get-Item libgourou_utils-0.8.10-windows-x64.zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v6
        with:
          name: libgourou-win-x64
          path: libgourou_utils-0.8.10-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
